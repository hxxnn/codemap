name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Unit tests
        run: pytest scripts/tests -q
      - name: Example outputs are consistent with their projects
        run: |
          for fx in python-todo-api ts-notes-cli edge-names; do
            python3 scripts/check_output.py "examples/$fx" "examples/$fx/docs/codemap"
          done
