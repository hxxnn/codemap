<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}} - {{PROJECT}}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
<link rel="stylesheet" href="assets/codemap.css">
</head>
<body>
<a class="cm-skip" href="#cm-main" id="cm-skip">Skip to content</a>
<div class="cm-shell">
  <aside class="cm-side">
    <details class="cm-nav" open>
      <summary id="cm-nav-title">Contents</summary>
      <ul id="cm-toc"></ul>
    </details>
    <div class="cm-legend" id="cm-legend" hidden>
      <h2 id="cm-legend-title">Legend</h2>
      <ul id="cm-legend-list"></ul>
    </div>
    <div class="cm-tools">
      <input type="search" id="cm-search" aria-label="Filter sections">
      <button class="cm-btn" id="cm-theme" type="button"></button>
    </div>
  </aside>
  <div class="cm-main">
    <header class="cm-head">
      <p class="cm-project">{{PROJECT}}</p>
      <h1>{{TITLE}}</h1>
      <dl class="cm-stats" id="cm-stats">
        <div><dt id="cm-l-generated">Generated</dt><dd>{{GENERATED}}</dd></div>
        <div><dt id="cm-l-sources">Files read</dt><dd>{{SOURCES}}</dd></div>
        <div><dt id="cm-l-unverified">Unverified</dt><dd id="cm-unverified-count">0</dd></div>
      </dl>
      <button class="cm-btn primary" id="cm-present" type="button" hidden></button>
    </header>
<main id="cm-main">
{{CONTENT}}
</main>
    <footer class="cm-foot">Generated by codemap</footer>
  </div>
</div>
<div class="cm-deck" id="cm-deck" hidden>
  <div class="cm-progress"><span></span></div>
  <div class="cm-deck-bar">
    <button class="cm-btn" id="cm-prev" type="button"></button>
    <span id="cm-count" aria-live="polite"></span>
    <button class="cm-btn" id="cm-next" type="button"></button>
    <button class="cm-btn" id="cm-exit" type="button"></button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" integrity="sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I" crossorigin="anonymous"></script>
<script src="assets/codemap.js"></script>
</body>
</html>
